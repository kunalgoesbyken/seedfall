name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          [ -z "$unformatted" ] || { echo "run gofmt -w on:"; echo "$unformatted"; exit 1; }
      - run: go vet -stdmethods=false ./...
      - run: GOOS=wasip1 GOARCH=wasm go vet ./sim
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -race ./...
  simulate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - config: examples/kvlog/seedfall.fixed.json
            seeds: 1-100
            name: kvlog-fixed
          - config: examples/kvlog/seedfall.rewind.json
            seeds: 1-100
            name: kvlog-rewind
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          config: ${{ matrix.config }}
          seeds: ${{ matrix.seeds }}
          check: "true"
          artifact-name: seedfall-report-${{ matrix.name }}
