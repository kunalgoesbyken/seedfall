name: regress
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regress:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - run: bash scripts/regress.sh | tee regress.log
        shell: bash
      - if: always()
        run: grep -E '^(PASS|FAIL|regression)' regress.log >> "$GITHUB_STEP_SUMMARY" || true
