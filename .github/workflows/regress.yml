name: regress
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  regress:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: bash scripts/regress.sh | tee regress.log
        shell: bash
      - if: always()
        run: grep -E '^(PASS|FAIL|regression)' regress.log >> "$GITHUB_STEP_SUMMARY" || true
