name: regress
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regress:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: bash scripts/regress.sh | tee regress.log
        shell: bash
      - if: always()
        run: grep -E '^(PASS|FAIL|regression)' regress.log >> "$GITHUB_STEP_SUMMARY" || true
