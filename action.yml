name: seedfall
description: Sweep seeds of a seedfall deterministic simulation and fail the job with a replayable seed when an invariant breaks.
branding:
  icon: bar-chart-2
  color: orange
inputs:
  config:
    description: Path to seedfall.json
    default: seedfall.json
  seeds:
    description: Seed or inclusive seed range
    default: 1-200
  check:
    description: Run every seed twice and fail at the first host call or trace line that differs
    default: "false"
  go-version:
    description: Go version used to build the nodes and seedfall
    default: stable
  report:
    description: Sweep every seed and upload an HTML triage report as an artifact
    default: "true"
  artifact-name:
    description: Name of the uploaded report artifact; must be unique per workflow run
    default: seedfall-report
  webhook:
    description: Slack or Discord incoming webhook URL, best passed from a secret; posts the report's new and regressed findings
    default: ""
  file-issues:
    description: File a GitHub issue for each finding in the report that has no open issue yet; needs report and the issues write permission
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
    - name: Build seedfall
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "$RUNNER_TEMP/seedfall" ./cmd/seedfall
    - name: Sweep seeds
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        SEEDS: ${{ inputs.seeds }}
        CHECK: ${{ inputs.check }}
        REPORT: ${{ inputs.report }}
      run: |
        set -o pipefail
        args=(run -c "$CONFIG" -seeds "$SEEDS" -check="$CHECK")
        [ "$REPORT" = "true" ] && args+=(-report "$RUNNER_TEMP/seedfall-report/report.html")
        "$RUNNER_TEMP/seedfall" "${args[@]}" | tee "$RUNNER_TEMP/seedfall.txt"
    - name: Summarize
      if: always()
      shell: bash
      run: |
        [ -f "$RUNNER_TEMP/seedfall.txt" ] || exit 0
        { echo '### seedfall'; echo '```'; tail -n 60 "$RUNNER_TEMP/seedfall.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
    - name: Collect failure artifacts
      if: always()
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
      run: |
        failures="$(dirname "$CONFIG")/.seedfall/failures"
        [ -d "$failures" ] || exit 0
        mkdir -p "$RUNNER_TEMP/seedfall-report"
        cp -R "$failures" "$RUNNER_TEMP/seedfall-report/"
    - name: Notify
      if: always() && inputs.report == 'true' && inputs.webhook != ''
      shell: bash
      env:
        SEEDFALL_WEBHOOK: ${{ inputs.webhook }}
        LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        [ -f "$RUNNER_TEMP/seedfall-report/report.json" ] || exit 0
        "$RUNNER_TEMP/seedfall" report notify -report "$RUNNER_TEMP/seedfall-report/report.html" -link "$LINK"
    - name: File issues
      if: always() && inputs.report == 'true' && inputs.file-issues == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        [ -f "$RUNNER_TEMP/seedfall-report/report.json" ] || exit 0
        "$RUNNER_TEMP/seedfall" report issue -report "$RUNNER_TEMP/seedfall-report/report.html" -repo "$REPO"
    - name: Upload triage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/seedfall-report
        if-no-files-found: ignore
